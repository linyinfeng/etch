name: tangle

on:
  push:
    branches: [main]
  workflow_dispatch:

concurrency:
  group: tangle
  cancel-in-progress: false

permissions:
  contents: write

jobs:
  tangle:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0 # the seed lives on another branch
          # The hand-over pushes a workflow file, which a repository token may not do; this one may, and
          # a push made with it also starts the branch's own pipeline.
          token: ${{ secrets.PAT_FOR_AUTOMATED_UPDATE }}

      # Tangling asks the document for its declarations; weaving renders it.
      - uses: typst-community/setup-typst@v5

      - name: unpack the seed
        run: |
          set -euo pipefail
          if ! ref=$(git rev-parse --verify --quiet origin/tangled); then
            echo "::error::no seed on origin/tangled — push the first generation by hand; this pipeline cannot start from nothing"
            exit 1
          fi
          mkdir -p tangled
          git archive "$ref" | tar -x -C tangled

      - name: build the seed
        run: cargo build --manifest-path tangled/Cargo.toml

      # The seed is the previous generation, so a document that moved a file leaves the old one behind.
      # Nothing is removed on its own; this asks, and on an ordinary run there is nothing to ask about.
      - name: drop what the previous generation left behind
        run: ./tangled/target/debug/lp unaccounted lp.typ --delete

      - name: tangle, and check the tree against the document
        run: |
          set -euo pipefail
          ./tangled/target/debug/lp tangle lp.typ
          ./tangled/target/debug/lp tangle lp.typ --check

      - name: weave the document
        run: |
          set -euo pipefail
          ./tangled/target/debug/lp weave lp.typ lp.pdf
          ./tangled/target/debug/lp weave lp.typ lp.html --features html

      - uses: actions/upload-artifact@v7
        with:
          name: pdf
          path: lp.pdf

      - uses: actions/upload-artifact@v7
        with:
          name: html
          path: lp.html

      - name: hand the generation to the seed branch
        run: |
          set -euo pipefail
          root=$PWD
          git init -q tangled
          git -C tangled add -A

          tmp=$(mktemp -d)
          idx=$(mktemp)
          rm -f "$idx"
          git -C tangled ls-files -z | tar -C tangled --null -T - -cf - | tar -C "$tmp" -xf -
          (cd "$tmp" && GIT_DIR="$root/.git" GIT_WORK_TREE="$tmp" GIT_INDEX_FILE="$idx" git add -A .)
          tree=$(GIT_DIR="$root/.git" GIT_INDEX_FILE="$idx" git write-tree)
          rm -rf "$tmp" "$idx"

          # An ignore rule can hide a file the document declares — the seed would then be a
          # generation missing part of itself, and only a fresh clone would notice.
          declared=$(./tangled/target/debug/lp tangle lp.typ --check | sed -e 's/\x1b\[[0-9;]*m//g' -e 's/^ok *//')
          missing=$(printf '%s\n' "$declared" | while read -r file; do
            [ -z "$file" ] && continue
            git cat-file -e "$tree:$file" 2>/dev/null || echo "$file"
          done)
          if [ -n "$missing" ]; then
            echo "::error::the generation is missing files the document declares: $missing"
            exit 1
          fi

          parent=$(git rev-parse origin/tangled)
          if [ "$(git rev-parse "$parent^{tree}")" = "$tree" ]; then
            echo "the seed is unchanged"
            exit 0
          fi
          commit=$(git -c user.name=github-actions -c user.email=github-actions@github.com \
            commit-tree "$tree" -p "$parent" -m "The generation main writes ($GITHUB_SHA)")
          git push origin "$commit:refs/heads/tangled"
          echo "pushed $(git rev-parse --short "$commit") to tangled"
